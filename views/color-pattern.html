<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body id="dark">
    <div class="container">
      <button id="back">Back</button>

      <div id="color-contrast-tool">
        <div id="color-display"></div>
        <div id="contrastResult" style="margin-top: 1em"></div>
        <button id="generate">Generate</button>
      </div>
    </div>
  </body>
</html>

<script type="module">
  const resultDiv = document.getElementById('color-display');
  const generateBtn = document.getElementById('generate');

  document.getElementById('back').onclick = () => {
    parent.postMessage({ pluginMessage: { type: 'BACK' } }, '*');
  };

  document.getElementById('generate').onclick = () => {
    requestGenerate();
  };

  function requestGenerate() {
    loadingScreen();
    parent.postMessage({ pluginMessage: { type: 'GENERATE' } }, '*');
  }

  function renderHexColors(hexes) {
    if (!hexes || hexes.length < 5) {
      resultDiv.innerHTML = '<p>Could not load colors.</p>';
      return;
    }
    let html = '';
    hexes.forEach((hex, index) => {
      html += `<button type="button" id="display-area-${index}" title="${hex}" style="background-color: ${hex}; width: 100%; height: 4rem; margin-bottom: 1rem; border: none; cursor: pointer;"></button>`;
    });
    resultDiv.innerHTML = html;
    hexes.forEach((_hex, index) => {
      const button = document.getElementById(`display-area-${index}`);
      if (button) {
        button.addEventListener('click', () => buttonOnClick(`display-area-${index}`));
      }
    });
  }

  function loadingScreen() {
    generateBtn.innerHTML = '<span class="loader"></span> Generate';
  }

  function resetGenerateButton() {
    generateBtn.textContent = 'Generate';
  }

  function buttonOnClick(id) {
    const button = document.getElementById(id);
    if (button) {
      const frameColor = button.title;
      parent.postMessage({ pluginMessage: { type: 'NOTIFY', frameColor } }, '*');
    }
  }

  window.onmessage = (event) => {
    const msg = event.data.pluginMessage;
    if (!msg || msg.type !== 'COLOR_PATTERN_PALETTE') return;
    const { colors } = msg;
    renderHexColors(colors);
    resetGenerateButton();
  };
</script>
